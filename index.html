<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091522"><title>FIND YOUR 2027</title><style>
*{box-sizing:border-box}html{background:#091522}body{margin:0;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 45%,#213e55 0%,#102437 45%,#091522 85%);min-height:100vh;min-height:100dvh;text-align:center}main{max-width:1600px;margin:auto;padding: max(18px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom))}section[hidden]{display:none!important}#home{height:calc(100vh - 36px);height:calc(100dvh - max(18px,env(safe-area-inset-top)) - max(12px,env(safe-area-inset-bottom)));min-height:400px;display:flex;flex-direction:column;align-items:center}header{width:100%;padding:8px 0 18px;border-bottom:1px solid #b9cce222}h1{font-size:clamp(23px,5vw,46px);letter-spacing:.075em;margin:0 0 10px;font-weight:800}h1 em{font-style:normal;color:#f3dba8}header p{margin:0;font-size:clamp(12px,2.6vw,17px);color:#b9ccdc}#cloud{position:relative;width:100%;flex:1;min-height:180px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse,#9ac5ee0a,transparent 70%)}#cloud:before{content:"";position:absolute;inset:12%;border:1px solid #a4c5dd12;border-radius:50%;pointer-events:none}#cloud>span{position:absolute;white-space:nowrap;line-height:1.15;font-weight:800;letter-spacing:-.045em;animation:appear .65s both;text-shadow:0 0 24px #b8d8ff20}#cloud .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.empty-year{font-size:clamp(70px,24vw,190px);font-weight:800;color:#c4d9ef20;letter-spacing:-.08em}.empty-label{font-size:14px;color:#9db4c7}#count{font-size:12px;color:#9eb5c8;margin:8px 0 12px}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:15px 28px;background:linear-gradient(110deg,#f7e4b9,#d5b579);color:#142333;box-shadow:0 6px 30px #e4c68c22}#start{width:min(100%,340px);font-size:18px}button.secondary{background:transparent;color:#a8bfd0;border:1px solid #7d9cb344;box-shadow:none;font-size:12px;padding:8px 14px}.tools{display:flex;gap:8px;margin-top:12px}h2{font-size:clamp(20px,4vw,34px);margin:16px 0}p{line-height:1.6}.notice{font-size:12px;color:#a8bfd0;margin:0 0 16px}.camera{position:relative;width:min(100%,420px);height:min(52vh,500px);margin:auto;overflow:hidden;border-radius:24px;border:1px solid #7399ae;background:#14283a}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.guide{position:absolute;inset:15% 18%;border:2px dashed #a7e7ed;border-radius:45%;box-shadow:0 0 0 100vmax #07121e33}.guide.ready{border:3px solid #78f5b8;box-shadow:0 0 25px #78f5b866}.line{position:absolute;left:18%;right:18%;height:2px;background:#9ff;box-shadow:0 0 16px #9ff;animation:scan 2s infinite alternate linear}#status{min-height:60px;font-size:19px;font-weight:700;color:#d1e8ef}#result:not([hidden]){min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center}#keyword{font-size:clamp(65px,22vw,170px);font-weight:850;color:#f3dba8;text-shadow:0 0 55px #e8c68b55;animation:appear .8s both}#blessing{max-width:500px;color:#d6e3ed;font-size:18px}small{color:#d8bd85;letter-spacing:3px}#return{font-size:12px;color:#a8bfd0}@keyframes scan{from{top:15%}to{top:85%}}@keyframes appear{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><section id="home"><header><h1>FIND YOUR <em>2027</em></h1><p>우리의 소망이 모여 인솔의 미래가 됩니다.</p></header><div id="cloud"></div><p id="count"></p><button id="start">시작하기 →</button><div class="tools"><button class="secondary" id="demo">카메라 없이 체험</button><button class="secondary" id="reset">기록 초기화</button></div></section><section id="scan" hidden><h2>얼굴을 프레임에 맞춰 주세요</h2><p class="notice">영상은 저장하지 않으며 소망은 무작위로 선정됩니다.</p><div class="camera"><video id="video" autoplay muted playsinline></video><div class="guide"></div><div class="line"></div></div><p id="status" role="status">카메라 준비 중</p><button class="secondary" id="cancel">취소</button></section><section id="result" hidden><h2>당신의 2027년 소망은</h2><div id="keyword"></div><p id="blessing"></p><small>HAPPY NEW YEAR 2027</small><p id="return"></p><button id="back">메인 화면으로</button></section></main><script>
const $=id=>document.getElementById(id), pool=[['성장','어제보다 더 멋진 자신을 만나는 한 해가 되길 바랍니다.'],['도약','새로운 도전이 더 큰 가능성으로 이어지길 바랍니다.'],['건강','몸과 마음이 건강하고 활기찬 한 해가 되길 바랍니다.'],['행복','작은 순간마다 행복이 피어나길 바랍니다.'],['행운','기분 좋은 기회가 당신을 찾아오길 바랍니다.'],['성취','꾸준한 노력이 빛나는 결실로 돌아오길 바랍니다.'],['풍요','일상과 마음에 풍요로움이 가득하길 바랍니다.'],['기회','새로운 가능성의 문이 활짝 열리길 바랍니다.'],['평안','마음이 편안하고 따뜻한 날들이 이어지길 바랍니다.'],['결실','오랫동안 준비한 일이 아름다운 결실을 맺길 바랍니다.'],['사랑','소중한 사람들과 따뜻한 시간을 보내길 바랍니다.'],['균형','일과 삶이 조화를 이루는 한 해가 되길 바랍니다.'],['희망','모든 시작에 희망이 함께하길 바랍니다.'],['혁신','새로운 생각이 멋진 변화로 이어지길 바랍니다.'],['자신감','당신의 가능성을 믿고 힘차게 나아가길 바랍니다.'],['번영','함께하는 모든 일에 좋은 성과가 있길 바랍니다.']];let counts={},stream=null,token=0,timer;try{counts=JSON.parse(localStorage.getItem('wish2027')||'{}')||{}}catch{}function save(){try{localStorage.setItem('wish2027',JSON.stringify(counts))}catch{}}function render(){const entries=Object.entries(counts).filter(([w,n])=>pool.some(p=>p[0]===w)&&Number.isFinite(n)&&n>0).sort((a,b)=>b[1]-a[1]);$('count').textContent='지금까지 모인 소망 '+entries.reduce((a,b)=>a+b[1],0)+'개';const cloud=$('cloud');if($('home').hidden)return;cloud.replaceChildren();if(!entries.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<span class=empty-year>2027</span><span class=empty-label>첫 번째 소망을 남겨주세요</span>';cloud.append(e);return}const W=cloud.clientWidth,H=cloud.clientHeight;if(!W||!H)return;const max=entries[0][1],colors=['#f3dba8','#ffffff','#a9d8ed','#d5e5f1','#c7b5e4'];const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');let placements=[];for(let factor=1;factor>=.12;factor*=.83){placements=[];let failed=false;for(let i=0;i<entries.length;i++){const [w,n]=entries[i];const size=Math.round(Math.min(W*.40,H*.34,190)*(.45+.55*Math.sqrt(n/max))*factor);ctx.font=`750 ${size}px system-ui, sans-serif`;const ww=ctx.measureText(w).width+12,hh=size*1.2+8;let found=false;const phase=Math.random()*Math.PI*2;for(let j=0;j<1600;j++){const r=Math.sqrt(j/1599),ang=j*2.399963+phase;const x=W/2+Math.cos(ang)*r*(W-ww)/2-ww/2,y=H/2+Math.sin(ang)*r*(H-hh)/2-hh/2;if(x<0||y<0||x+ww>W||y+hh>H)continue;if(placements.some(p=>x<p.x+p.ww&&x+ww>p.x&&y<p.y+p.hh&&y+hh>p.y))continue;placements.push({w,n,x,y,ww,hh,size,i});found=true;break}if(!found){failed=true;break}}if(!failed)break}if(placements.length!==entries.length){cloud.style.display='flex';cloud.style.flexWrap='wrap';cloud.style.alignContent='center';cloud.style.justifyContent='center';for(const [w,n] of entries){const e=document.createElement('span');e.style.position='static';e.style.fontSize=Math.max(14,Math.min(40,W/10)*Math.sqrt(n/max))+'px';e.textContent=w;cloud.append(e)}return}cloud.style.display='block';for(const p of placements){const e=document.createElement('span');e.textContent=p.w;e.style.left=(p.x+6)+'px';e.style.top=(p.y+4)+'px';e.style.fontSize=p.size+'px';e.style.color=colors[p.i%colors.length];e.style.animationDelay=Math.min(p.i*45,400)+'ms';cloud.append(e)}}function show(id){for(const s of ['home','scan','result'])$(s).hidden=s!==id}function stop(){token++;clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}function home(){stop();show('home');render()}function reveal(){stop();let [w,d]=pool[Math.floor(Math.random()*pool.length)];counts[w]=(counts[w]||0)+1;save();$('keyword').textContent=w;$('blessing').textContent=d;show('result');let n=7;$('return').textContent=n+'초 후 메인 화면으로 돌아갑니다.';timer=setInterval(()=>{if(--n<=0)home();else $('return').textContent=n+'초 후 메인 화면으로 돌아갑니다.'},1000)}let modelPromise;
async function getDetector(){if(!modelPromise)modelPromise=(async()=>{const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm');const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');return vision.FaceDetector.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'VIDEO',minDetectionConfidence:0.65});})().catch(e=>{modelPromise=null;throw e});return modelPromise;}
function aligned(box){const v=$('video'),r=v.getBoundingClientRect(),g=document.querySelector('.guide').getBoundingClientRect();const scale=Math.max(r.width/v.videoWidth,r.height/v.videoHeight);const w=box.width*scale,h=box.height*scale;const x=r.left+(r.width-v.videoWidth*scale)/2+box.originX*scale;const y=r.top+(r.height-v.videoHeight*scale)/2+box.originY*scale;const cx=r.right-(x-r.left)-w/2,cy=y+h/2;return Math.abs(cx-(g.left+g.width/2))<g.width*.19&&Math.abs(cy-(g.top+g.height/2))<g.height*.19&&w>=g.width*.38&&w<=g.width*.94&&h>=g.height*.34&&h<=g.height*.95;}
async function start(){stop();let t=token;show('scan');const guide=document.querySelector('.guide');guide.classList.remove('ready');$('status').textContent='카메라 준비 중';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Safari에서 HTTPS 주소로 접속해 주세요.');let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});if(t!==token){s.getTracks().forEach(x=>x.stop());return}stream=s;$('video').srcObject=s;await $('video').play();if(t!==token)return;$('status').textContent='얼굴 감지 준비 중';const detector=await getDetector();if(t!==token)return;let since=null,last=-1;while(t===token){const v=$('video');if(v.readyState>=2&&v.currentTime!==last){last=v.currentTime;const faces=detector.detectForVideo(v,performance.now()).detections;const ok=faces.length===1&&aligned(faces[0].boundingBox);guide.classList.toggle('ready',ok);if(ok){const now=performance.now();if(since===null)since=now;const left=3000-(now-since);if(left<=0){reveal();return}$('status').textContent='스캔 중 · '+Math.ceil(left/1000);}else{since=null;$('status').textContent=faces.length>1?'한 분씩 참여해 주세요.':'얼굴을 프레임 중앙에 맞춰 주세요.';}}await new Promise(r=>setTimeout(r,100));}}catch(e){if(t===token){stop();guide.classList.remove('ready');$('status').textContent='카메라 또는 얼굴 감지 연결 실패. 인터넷과 카메라 권한을 확인해 주세요.';console.error(e);}}}
$('start').onclick=start;$('demo').onclick=reveal;$('cancel').onclick=home;$('back').onclick=home;$('reset').onclick=()=>{if(confirm('모든 소망 기록을 초기화할까요?')){counts={};save();render()}};window.addEventListener('pagehide',stop);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,150)});document.fonts?.ready.then(render);render();</script></body></html>
