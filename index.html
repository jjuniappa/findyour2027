<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIND YOUR 2027</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#203b50,#091421 75%);color:#fff;font-family:system-ui,sans-serif;min-height:100dvh;text-align:center}main{max-width:850px;margin:auto;padding:30px 20px}small{color:#d8bd85;letter-spacing:3px}h1{font-size:clamp(65px,17vw,140px);margin:12px 0;color:#f3dba8;line-height:1}h2{font-size:26px}p{color:#c1d2df;line-height:1.7}button{border:1px solid #d8bd85;background:#e8d0a0;color:#142333;padding:16px 24px;border-radius:40px;font-size:17px;font-weight:bold;cursor:pointer;margin:8px}button.secondary{background:transparent;color:#ddd;border-color:#63778b;font-size:13px}#cloud{min-height:180px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;align-items:center;gap:16px;padding:24px 8px}#cloud span{color:#e6d1a6}section[hidden]{display:none!important}.camera{position:relative;max-width:460px;margin:auto;aspect-ratio:3/4;overflow:hidden;border-radius:24px;border:1px solid #7399ae}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.guide{position:absolute;inset:15% 18%;border:2px dashed #a7e7ed;border-radius:45%;box-shadow:0 0 30px #7bcbd533}.line{position:absolute;left:10%;right:10%;height:2px;background:#9ff;box-shadow:0 0 16px #9ff;animation:scan 2s infinite alternate linear}@keyframes scan{from{top:15%}to{top:85%}}#keyword{font-size:clamp(65px,18vw,130px);color:#f4d69a;margin:30px 0}#status{min-height:55px}footer{font-size:12px;color:#a8bac8;margin-top:25px} @media(min-width:800px){.camera{aspect-ratio:4/3;max-width:520px}}
</style></head><body><main><small>NEW YEAR EXPERIENCE</small><section id="home"><h2>FIND YOUR</h2><h1>2027</h1><p>우리의 소망이 모여 새로운 미래가 됩니다.</p><div id="cloud"></div><p id="count"></p><button id="start">나의 2027년 소망 찾기 →</button><p>카메라 영상은 저장하지 않습니다.<br>소망은 재미를 위한 무작위 행운 키워드입니다.</p><button class="secondary" id="demo">카메라 없이 체험</button><button class="secondary" id="reset">기록 초기화</button></section><section id="scan" hidden><h2>카메라를 바라봐 주세요</h2><div class="camera"><video id="video" autoplay muted playsinline></video><div class="guide"></div><div class="line"></div></div><p id="status" role="status">카메라 준비 중</p><button id="manual" hidden>얼굴을 맞췄어요 · 스캔 시작</button><button class="secondary" id="cancel">취소</button></section><section id="result" hidden><h2>당신의 2027년 소망은</h2><div id="keyword"></div><p id="blessing"></p><small>HAPPY NEW YEAR 2027</small><p id="return"></p><button id="back">메인 화면으로</button></section><footer>2027 WISH WALL · 얼굴 사진 및 영상 미저장</footer></main><script>
const $=id=>document.getElementById(id), pool=[['성장','어제보다 더 멋진 자신을 만나는 한 해가 되길 바랍니다.'],['도약','새로운 도전이 더 큰 가능성으로 이어지길 바랍니다.'],['건강','몸과 마음이 건강하고 활기찬 한 해가 되길 바랍니다.'],['행복','작은 순간마다 행복이 피어나길 바랍니다.'],['행운','기분 좋은 기회가 당신을 찾아오길 바랍니다.'],['성취','꾸준한 노력이 빛나는 결실로 돌아오길 바랍니다.'],['풍요','일상과 마음에 풍요로움이 가득하길 바랍니다.'],['기회','새로운 가능성의 문이 활짝 열리길 바랍니다.'],['평안','마음이 편안하고 따뜻한 날들이 이어지길 바랍니다.'],['결실','오랫동안 준비한 일이 아름다운 결실을 맺길 바랍니다.'],['사랑','소중한 사람들과 따뜻한 시간을 보내길 바랍니다.'],['균형','일과 삶이 조화를 이루는 한 해가 되길 바랍니다.'],['희망','모든 시작에 희망이 함께하길 바랍니다.'],['혁신','새로운 생각이 멋진 변화로 이어지길 바랍니다.'],['자신감','당신의 가능성을 믿고 힘차게 나아가길 바랍니다.'],['번영','함께하는 모든 일에 좋은 성과가 있길 바랍니다.']];let counts={},stream=null,token=0,timer;try{counts=JSON.parse(localStorage.getItem('wish2027')||'{}')||{}}catch{}function save(){try{localStorage.setItem('wish2027',JSON.stringify(counts))}catch{}}function render(){let entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);$('cloud').replaceChildren();if(!entries.length){$('cloud').textContent='첫 번째 소망의 주인공이 되어 주세요.'}for(const [w,n] of entries){let s=document.createElement('span');s.textContent=w;s.style.fontSize=Math.min(64,22+Math.sqrt(n)*8)+'px';$('cloud').append(s)}$('count').textContent='지금까지 모인 소망 '+entries.reduce((a,b)=>a+b[1],0)+'개'}function show(id){for(const s of ['home','scan','result'])$(s).hidden=s!==id}function stop(){token++;clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}function home(){stop();render();show('home')}function reveal(){stop();let [w,d]=pool[Math.floor(Math.random()*pool.length)];counts[w]=(counts[w]||0)+1;save();$('keyword').textContent=w;$('blessing').textContent=d;show('result');let n=7;$('return').textContent=n+'초 후 메인 화면으로 돌아갑니다.';timer=setInterval(()=>{if(--n<=0)home();else $('return').textContent=n+'초 후 메인 화면으로 돌아갑니다.'},1000)}function countdown(){let t=token,n=3;$('manual').hidden=true;$('status').textContent='스캔 중 · '+n;timer=setInterval(()=>{if(t!==token){clearInterval(timer);return}if(--n<=0)reveal();else $('status').textContent='스캔 중 · '+n},1000)}async function start(){stop();let t=token;show('scan');$('manual').hidden=true;$('status').textContent='카메라 준비 중';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('카메라 사용에는 HTTPS 또는 localhost가 필요합니다.');let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});if(t!==token){s.getTracks().forEach(x=>x.stop());return}stream=s;$('video').srcObject=s;await $('video').play();if(t!==token)return;if('FaceDetector' in window){try{let detector=new FaceDetector({maxDetectedFaces:1,fastMode:true});$('status').textContent='얼굴을 가이드 안에 맞춰 주세요.';let deadline=Date.now()+12000;while(t===token&&Date.now()<deadline){let faces=await detector.detect($('video'));if(t!==token)return;if(faces.length){countdown();return}await new Promise(r=>setTimeout(r,250))}}catch{}}if(t===token){$('status').textContent='이 브라우저에서는 자동 얼굴 감지를 사용할 수 없습니다. 얼굴을 맞춘 후 버튼을 눌러 주세요.';$('manual').hidden=false}}catch(e){if(t===token){$('status').textContent='카메라 연결 실패: '+e.message+' · 취소 후 카메라 없이 체험할 수 있습니다.'}}} $('start').onclick=start;$('demo').onclick=reveal;$('manual').onclick=countdown;$('cancel').onclick=home;$('back').onclick=home;$('reset').onclick=()=>{if(confirm('모든 소망 기록을 초기화할까요?')){counts={};save();render()}};window.addEventListener('pagehide',stop);render();</script></body></html>
